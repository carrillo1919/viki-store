openapi: 3.0.3
info:
  title: Viki-Store Inventory Management API
  description: API for managing inventory, users, and operations for Viki-Store. Designed for human users and autonomous agents.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        roleId:
          type: integer
        isActive:
          type: boolean
      required:
        - username
        - email
        - roleId

    Product:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
          description: Unique Stock Keeping Unit
        name:
          type: string
        description:
          type: string
        stock:
          type: integer
          minimum: 0
        minStock:
          type: integer
          minimum: 0
        price:
          type: number
          format: float
        category:
          type: string
      required:
        - sku
        - name
        - stock
        - minStock
        - price

    Movement:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        type:
          type: string
          enum: [IN, OUT]
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
        responsibleId:
          type: integer
        responsibleType:
          type: string
          enum: [USER, AGENT]
      required:
        - productId
        - type
        - quantity
        - reason
        - responsibleId
        - responsibleType

    StockCheck:
      type: object
      properties:
        sku:
          type: string
          description: SKU of the product to check
      required:
        - sku

    StockResponse:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        stock:
          type: integer
        available:
          type: boolean

    SaleRegistration:
      type: object
      properties:
        sku:
          type: string
          description: SKU of the product being sold
        quantity:
          type: integer
          minimum: 1
          description: Quantity to sell
        reason:
          type: string
          description: Reason for the sale (optional)
      required:
        - sku
        - quantity

    Lead:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        message:
          type: string
      required:
        - name
        - email

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticate a user and return a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /products:
    get:
      summary: Get all products
      description: Retrieve a list of all products in inventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product
      description: Add a new product to the inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      summary: Get a product by ID
      description: Retrieve details of a specific product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: Update a product
      description: Modify an existing product's details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      summary: Delete a product
      description: Remove a product from inventory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Product deleted

  /movements:
    get:
      summary: Get all movements
      description: Retrieve a list of all inventory movements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movement'
    post:
      summary: Create a movement
      description: Record an inventory movement (in or out)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movement'
      responses:
        '201':
          description: Movement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'

  /reports/inventory/pdf:
    get:
      summary: Generate inventory PDF report
      description: Download a PDF report of current inventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /reports/inventory/excel:
    get:
      summary: Generate inventory Excel report
      description: Download an Excel spreadsheet of current inventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /agent/check-stock:
    post:
      summary: Check product stock
      description: Check the current stock level of a product by SKU. Used by autonomous agents to verify availability.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCheck'
      responses:
        '200':
          description: Stock information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          description: Product not found

  /agent/register-sale:
    post:
      summary: Register a product sale
      description: Record a sale transaction and update inventory. Used by autonomous agents to process sales.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRegistration'
      responses:
        '200':
          description: Sale registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  movementId:
                    type: integer
                  remainingStock:
                    type: integer
        '400':
          description: Invalid request or insufficient stock

  /agent/add-lead:
    post:
      summary: Add a new lead
      description: Add a potential customer lead to the system. Used by autonomous agents for lead generation.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lead'
      responses:
        '201':
          description: Lead added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  lead:
                    $ref: '#/components/schemas/Lead'